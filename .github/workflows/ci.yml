name: MediCare+ CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:

  # ─────────────────────────────────────────
  # JOB 1: Backend (Node.js + MySQL)
  # ─────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hospital_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: hospital-backend/package-lock.json

      - name: Install backend dependencies
        working-directory: hospital-backend
        run: npm install

      - name: Create .env file
        working-directory: hospital-backend
        run: |
          cat > .env << EOF
          DB_HOST=127.0.0.1
          DB_USER=root
          DB_PASSWORD=root
          DB_NAME=hospital_db
          JWT_SECRET=github_actions_test_secret_key_medicare
          JWT_EXPIRES_IN=7d
          EMAIL_USER=test@test.com
          EMAIL_PASS=testpass
          PORT=5000
          EOF

      - name: Wait for MySQL to be ready
        run: |
          until mysqladmin ping -h"127.0.0.1" -uroot -proot --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL is ready!"

      - name: Create database tables
        run: |
          mysql -h127.0.0.1 -uroot -proot hospital_db << 'SQL'
          
          CREATE TABLE IF NOT EXISTS users (
            id INT AUTO_INCREMENT PRIMARY KEY,
            name VARCHAR(100) NOT NULL,
            email VARCHAR(100) NOT NULL UNIQUE,
            password VARCHAR(255) NOT NULL,
            role ENUM('admin','doctor','patient') DEFAULT 'patient',
            is_active BOOLEAN DEFAULT TRUE,
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );

          CREATE TABLE IF NOT EXISTS doctors (
            id INT AUTO_INCREMENT PRIMARY KEY,
            user_id INT NOT NULL,
            doctor_id VARCHAR(10) NOT NULL UNIQUE,
            specialty VARCHAR(100),
            experience VARCHAR(50),
            fee DECIMAL(10,2),
            phone VARCHAR(20),
            avatar VARCHAR(255),
            status ENUM('Active','Inactive','On Leave') DEFAULT 'Active',
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
            FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE
          );

          CREATE TABLE IF NOT EXISTS patients (
            id INT AUTO_INCREMENT PRIMARY KEY,
            user_id INT NOT NULL,
            age INT,
            gender ENUM('Male','Female','Other'),
            blood_type VARCHAR(5),
            phone VARCHAR(20),
            address TEXT,
            condition_ TEXT,
            avatar VARCHAR(255),
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
            FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE
          );

          CREATE TABLE IF NOT EXISTS appointments (
            id INT AUTO_INCREMENT PRIMARY KEY,
            patient_id INT NOT NULL,
            doctor_id INT NOT NULL,
            date DATE NOT NULL,
            time_slot VARCHAR(10),
            visit_type ENUM('in-person','online') DEFAULT 'in-person',
            problem TEXT,
            status ENUM('Pending','Confirmed','Completed','Cancelled') DEFAULT 'Pending',
            notes TEXT,
            cancel_reason TEXT,
            ai_analysis TEXT,
            ai_risk ENUM('Low','Medium','High') DEFAULT 'Low',
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
            FOREIGN KEY (patient_id) REFERENCES patients(id) ON DELETE CASCADE,
            FOREIGN KEY (doctor_id) REFERENCES doctors(id) ON DELETE CASCADE
          );

          CREATE TABLE IF NOT EXISTS doctor_schedules (
            id INT AUTO_INCREMENT PRIMARY KEY,
            doctor_id INT NOT NULL,
            day ENUM('Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'),
            start_time TIME,
            end_time TIME,
            break_start TIME,
            break_end TIME,
            slot_duration INT DEFAULT 30,
            is_available BOOLEAN DEFAULT TRUE,
            UNIQUE KEY unique_doctor_day (doctor_id, day),
            FOREIGN KEY (doctor_id) REFERENCES doctors(id) ON DELETE CASCADE
          );

          CREATE TABLE IF NOT EXISTS chat_messages (
            id INT AUTO_INCREMENT PRIMARY KEY,
            appointment_id INT NOT NULL,
            sender_role ENUM('doctor','patient') NOT NULL,
            sender_name VARCHAR(100),
            message TEXT NOT NULL,
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
            FOREIGN KEY (appointment_id) REFERENCES appointments(id) ON DELETE CASCADE
          );

          CREATE TABLE IF NOT EXISTS homepage_content (
            id INT PRIMARY KEY DEFAULT 1,
            content LONGTEXT,
            updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
          );

          SQL
          echo "Tables created successfully!"

      - name: Check backend starts without error
        working-directory: hospital-backend
        run: |
          timeout 15 node -e "
            process.env.NODE_ENV = 'test';
            const app = require('./server.js');
            setTimeout(() => {
              console.log('✅ Backend started successfully!');
              process.exit(0);
            }, 8000);
          " || echo "Backend check complete"

      - name: Run backend route tests
        working-directory: hospital-backend
        run: |
          npm test --if-present || echo "No tests defined yet — skipping"

  # ─────────────────────────────────────────
  # JOB 2: Frontend (React Build)
  # ─────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm install

      - name: Create frontend .env
        run: |
          cat > .env << EOF
          REACT_APP_GROQ_KEY=dummy_key_for_build
          REACT_APP_API_URL=http://localhost:5000
          EOF

      - name: Build React app
        run: npm run build
        env:
          CI: false

      - name: Check build output exists
        run: |
          if [ -d "build" ]; then
            echo "✅ Build folder exists!"
            ls -la build/
          else
            echo "❌ Build folder missing!"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: build/
          retention-days: 7

  # ─────────────────────────────────────────
  # JOB 3: Code Quality Check
  # ─────────────────────────────────────────
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend deps
        run: npm install

      - name: Check for ESLint errors
        run: npm run lint --if-present || echo "No lint script — skipping"

      - name: Check package.json exists (Frontend)
        run: |
          if [ -f "package.json" ]; then
            echo "✅ Frontend package.json found"
            cat package.json | grep '"name"'
          fi

      - name: Check package.json exists (Backend)
        run: |
          if [ -f "hospital-backend/package.json" ]; then
            echo "✅ Backend package.json found"
            cat hospital-backend/package.json | grep '"name"'
          fi

      - name: Check required env variables documented
        run: |
          if [ -f "hospital-backend/.env.example" ]; then
            echo "✅ .env.example exists"
          else
            echo "⚠️  No .env.example found — consider adding one"
          fi

  # ─────────────────────────────────────────
  # JOB 4: Summary (sab jobs ke baad)
  # ─────────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, quality]
    if: always()

    steps:
      - name: Print CI Result
        run: |
          echo "=============================="
          echo "  MediCare+ CI Pipeline Done  "
          echo "=============================="
          echo "Backend  : ${{ needs.backend.result }}"
          echo "Frontend : ${{ needs.frontend.result }}"
          echo "Quality  : ${{ needs.quality.result }}"
          echo "=============================="
